<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>...</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700;900&family=Cormorant+Garamond:ital,wght@0,400;0,600;0,700;1,400&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body class="center-content">
    <div class="card">
        <h2>Willkommen 😊</h2>
        <p>Es ist mir eine außerordentliche Ehre, Ihre Hoheit hier begrüßen zu dürfen 👑</p>
        <div class="status-box">
            <p id="status-text">Detecting if Wafi has unauthorized thoughts about Your Highness ...</p>
            <div class="progress-bar"><div id="progress-fill"></div></div>
            <p id="percent">0%</p>
        </div>
    </div>
    <script src="script.js"></script>
    <script>
    const totalDuration = 10000; // Dauer in Millisekunden (10000 = 10 Sekunden)
    let startTime = null;

    function startScan(timestamp) {
        if (!startTime) startTime = timestamp;
        
        // Berechnet den Fortschritt von 0 bis 1 basierend auf der Zeit
        const progress = Math.min((timestamp - startTime) / totalDuration, 1);
        const percent = Math.floor(progress * 100);

        // Synchronisiere Balken und Prozentzahl
        document.getElementById('progress-fill').style.width = percent + '%';
        document.getElementById('percent').innerText = percent + '%';

        if (progress < 1) {
            requestAnimationFrame(startScan);
        } else {
            // Nach Abschluss des Scans weiterleiten
            setTimeout(() => { window.location.href = 'error.html'; }, 500);
        }
    }

    // Scan starten
    requestAnimationFrame(startScan);
</script>
</body>
</html>
